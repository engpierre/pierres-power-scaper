<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pierre's Power Scraper — Canada & Northern US</title>
  <style>
    :root {
      --bg-dark: #0a0d14;
      --panel-bg: #0f172a;
      --border-color: #1e293b;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Command Header */
    header {
      height: 50px;
      background: rgba(10, 13, 20, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 1000;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #f8fafc;
    }
    .brand span { color: var(--accent-cyan); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .export-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #334155;
      color: #38bdf8;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }
    .export-btn:hover {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      transform: translateY(-1px);
    }
    .export-btn.saved {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.12);
      padding: 4px 11px;
      border-radius: 9999px;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }

    /* Main Workspace */
    .workspace {
      flex: 1;
      display: flex;
      position: relative;
      height: calc(100vh - 50px);
    }

    /* Left Sidebar */
    aside {
      width: 310px;
      min-width: 310px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 500;
      overflow-y: auto;
      padding: 14px;
    }
    .sidebar-section {
      margin-bottom: 16px;
    }
    .sidebar-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .corridor-btn {
      width: 100%;
      text-align: left;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      color: #e2e8f0;
      transition: all 0.18s ease-in-out;
    }
    .corridor-btn:hover {
      background: #27354a;
      border-color: var(--accent-cyan);
      transform: translateX(3px);
    }
    .corridor-btn.active {
      background: #1e3a5f;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.25);
    }
    .corridor-btn .title {
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .corridor-btn .title span {
      font-size: 10.5px;
      color: #94a3b8;
      font-weight: 500;
      background: rgba(148, 163, 184, 0.12);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .corridor-btn .tickers {
      font-size: 11px;
      color: var(--accent-cyan);
      margin-top: 4px;
      font-weight: 500;
    }
    .corridor-btn .desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Snapshots Drawer / Status in Sidebar */
    .snapshots-panel {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
      font-size: 11px;
      color: var(--text-muted);
    }
    .snapshots-list {
      max-height: 120px;
      overflow-y: auto;
      margin-top: 8px;
    }
    .snapshot-item {
      padding: 4px 6px;
      border-radius: 4px;
      background: rgba(30, 41, 59, 0.5);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
    }

    /* Map iframe container */
    #map-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background-color: var(--bg-dark);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2.5">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      Pierre's Power Scraper <span>// CAN-US Corridor</span>
    </div>
    <div class="header-actions">
      <button id="export-btn" class="export-btn" onclick="exportSnapshot()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Export Snapshot
      </button>
      <div class="status-badge">
        <div class="status-dot"></div>
        ACTIVE TERMINAL
      </div>
    </div>
  </header>

  <div class="workspace">
    <aside>
      <div class="sidebar-section">
        <div class="sidebar-title">Border Intertie Corridors</div>

        <button class="corridor-btn active" onclick="navigateTo(this, 'Quebec ➔ NY / NE CHPE', 44.8, -74.2, 7.0)">
          <div class="title">Quebec ➔ NY / NE <span>CHPE</span></div>
          <div class="tickers">Hydro-Québec | ES | NEE</div>
          <div class="desc">HVDC link directly to NYC load zone.</div>
        </button>

        <button class="corridor-btn" onclick="navigateTo(this, 'Ontario ➔ NYISO / MISO Nuclear', 43.8, -78.8, 7.0)">
          <div class="title">Ontario ➔ NYISO / MISO <span>Nuclear</span></div>
          <div class="tickers">H.TO | CEG | BEP-UN.TO</div>
          <div class="desc">Lake Ontario baseload & cross-border ties.</div>
        </button>

        <button class="corridor-btn" onclick="navigateTo(this, 'Upper Midwest ➔ MISO Central', 47.2, -88.5, 6.2)">
          <div class="title">Upper Midwest ➔ MISO <span>Central</span></div>
          <div class="tickers">FTS.TO (ITC) | DTE | XEL</div>
          <div class="desc">Manitoba/Ontario wheeling lines into MISO.</div>
        </button>

        <button class="corridor-btn" onclick="navigateTo(this, 'Western Intertie AB/BC ➔ PNW', 50.8, -114.5, 6.5)">
          <div class="title">Western Intertie <span>AB/BC ➔ PNW</span></div>
          <div class="tickers">TA.TO | CPX.TO | BC Hydro</div>
          <div class="desc">Pacific NW interties & regional gas peakers.</div>
        </button>

        <button class="corridor-btn" onclick="navigateTo(this, 'Atlantic Hub Maritime Link', 45.2, -66.5, 6.8)">
          <div class="title">Atlantic Hub <span>Maritime Link</span></div>
          <div class="tickers">EMA.TO | NPI.TO</div>
          <div class="desc">Maritimes to ISO-NE flow & offshore nodes.</div>
        </button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">Macro Preset</div>
        <button class="corridor-btn" onclick="navigateTo(this, 'Full Cross-Border Corridor', 49.0, -96.0, 4.8)">
          <div class="title">Full Cross-Border Corridor</div>
          <div class="desc">Macro overview: 42°N to 60°N band.</div>
        </button>
      </div>

      <div class="snapshots-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Recent Local Snapshots:</span>
          <a href="/api/snapshots" target="_blank" style="color:#06b6d4; text-decoration:none;">View All ↗</a>
        </div>
        <div id="snapshots-list" class="snapshots-list">
          <div style="color:#64748b; font-style:italic;">No exports in this session yet.</div>
        </div>
      </div>
    </aside>

    <iframe
      id="map-frame"
      src="https://opengridworks.com/power-plants?lat=44.8&lng=-74.2&z=7.0&layers=tx,datacenters,hpoints,rowTx,rowSubs&panel=closed"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
    </iframe>
  </div>

  <script>
    let currentCorridor = 'Quebec ➔ NY / NE CHPE';
    let currentLat = 44.8;
    let currentLng = -74.2;
    let currentZoom = 7.0;

    function navigateTo(btnEl, corridorName, lat, lng, zoom) {
      currentCorridor = corridorName;
      currentLat = lat;
      currentLng = lng;
      currentZoom = zoom;

      // Update active highlight
      document.querySelectorAll('.corridor-btn').forEach(btn => btn.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');

      // Update iframe map camera
      const frame = document.getElementById('map-frame');
      const base = 'https://opengridworks.com/power-plants';
      const layers = 'tx,datacenters,hpoints,rowTx,rowSubs';
      frame.src = `${base}?lat=${lat}&lng=${lng}&z=${zoom}&layers=${layers}&panel=closed`;
    }

    async function exportSnapshot() {
      const btn = document.getElementById('export-btn');
      const payload = {
        corridor: currentCorridor,
        lat: currentLat,
        lng: currentLng,
        zoom: currentZoom,
        url: document.getElementById('map-frame').src,
        timestamp: new Date().toISOString()
      };

      try {
        btn.innerHTML = `<span>Saving...</span>`;
        const res = await fetch('/api/snapshot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status === 'success') {
          btn.classList.add('saved');
          btn.innerHTML = `<span>✓ Saved to Home PC</span>`;
          updateRecentList(data.file);

          setTimeout(() => {
            btn.classList.remove('saved');
            btn.innerHTML = `
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              Export Snapshot
            `;
          }, 2400);
        } else {
          alert('Save failed: ' + (data.message || 'unknown error'));
        }
      } catch (err) {
        console.error('Export error:', err);
        alert('Network error communicating with home PC.');
      }
    }

    function updateRecentList(filename) {
      const list = document.getElementById('snapshots-list');
      const cleanName = filename.split(/[\\/]/).pop();
      const div = document.createElement('div');
      div.className = 'snapshot-item';
      div.innerHTML = `<span>${cleanName}</span><span>now</span>`;
      if (list.innerHTML.includes('No exports')) {
        list.innerHTML = '';
      }
      list.prepend(div);
    }
  </script>
</body>
</html>
